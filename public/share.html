<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบแชร์โปรไฟล์ผู้สมัคร - Double A Alliance</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', 'Sarabun', sans-serif; background-color: #f8fafc; }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-indigo-50/40 to-slate-100 flex items-center justify-center p-4">
  <div id="app" class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 p-8 text-center animate-in fade-in zoom-in-95 duration-200">
    <div class="inline-flex items-center justify-center w-16 h-16 bg-indigo-600 text-white rounded-2xl shadow-md mb-4">
      <svg class="w-8 h-8 animate-spin" fill="none" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
      </svg>
    </div>
    <h2 class="text-xl font-bold text-slate-800 mb-2">กำลังเชื่อมต่อไปยังโปรไฟล์ผู้สมัคร</h2>
    <p class="text-xs text-slate-500 mb-6">กำลังตรวจสอบสิทธิ์การเข้าถึงข้อมูล...</p>
    <div class="bg-indigo-50/80 rounded-xl p-3 text-xs text-indigo-900 border border-indigo-100 flex items-center justify-center gap-2">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span class="font-mono text-[11px]" id="status-text">Connecting to Secure Gateway...</span>
    </div>
  </div>

  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('t') || urlParams.get('token') || urlParams.get('shareToken') || urlParams.get('share');

      // Canonical production target app
      const targetBase = 'https://hrbp-three.vercel.app';

      if (token && /^[a-f0-9]{64}$/i.test(token)) {
        document.getElementById('status-text').textContent = 'Token verified. Redirecting...';
        // Redirect to React SPA with share token
        const destination = `${targetBase}/share/${encodeURIComponent(token)}`;
        window.location.replace(destination);
      } else {
        document.getElementById('app').innerHTML = `
          <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
            ⚠️
          </div>
          <h2 class="text-lg font-bold text-slate-800 mb-2">ลิงก์ไม่ถูกต้องหรือหมดอายุ</h2>
          <p class="text-xs text-slate-600 leading-relaxed mb-6">
            ไม่พบรหัส Token สำหรับเข้าดูโปรไฟล์ผู้สมัคร หรือลิงก์นี้หมดอายุการใช้งานแล้ว (อายุการใช้งาน 7 วัน)
          </p>
          <div class="bg-slate-50 rounded-xl p-3 text-xs text-slate-500 border border-slate-200 text-left mb-4">
            📌 หากคุณเป็นกรรมการสัมภาษณ์หรือผู้มีส่วนเกี่ยวข้อง กรุณาติดต่อผู้ส่งหรือ HR เพื่อขอรับลิงก์ใหม่อีกครั้ง
          </div>
        `;
      }
    })();
  </script>
</body>
</html>
